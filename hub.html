<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="https://allcare-edu.github.io/icon.png">
<title>올케어에듀 · 나의 학습</title>
<style>
:root{--c:#1F3864}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#f5f6f8;color:#1d2433;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.bar{position:sticky;top:0;z-index:5;background:var(--c);color:#fff;padding:10px 14px 12px;transition:background .25s}
.row{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
.logo{height:26px;width:auto;background:#fff;border-radius:6px;padding:3px 6px}
.who{font-size:15px;font-weight:700;letter-spacing:-.2px}
.who small{font-weight:500;opacity:.8;margin-left:4px}
.tabs{display:flex;gap:6px;max-width:760px;margin:10px auto 0;background:rgba(255,255,255,.14);padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:transparent;color:#fff;font:inherit;font-size:16px;font-weight:700;padding:10px 0;border-radius:9px;cursor:pointer;opacity:.75}
.tabs button.on{background:#fff;color:var(--c);opacity:1;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.tabs button .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
#frames{position:relative;height:calc(100dvh - 112px)}
#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#f5f6f8;display:none}
#frames iframe.on{display:block}
.msg{padding:60px 20px;text-align:center;color:#667085;font-size:15px;line-height:1.7}
</style>
</head><body>
<div class="bar" id="bar">
  <div class="row"><img class="logo" src="https://allcare-edu.github.io/logo.png" alt="올케어에듀학원"><div class="who" id="who">나의 학습</div></div>
  <div class="tabs" id="tabs"></div>
</div>
<div id="frames"><div class="msg" id="msg">불러오는 중…</div></div>
<script>
(function () {
  // 과목 순서·색 (수학이 기본 화면)
  var SUBJ = [
    { k: 'm', name: '수학', color: '#1F3864' },
    { k: 'e', name: '영어', color: '#4E2A84' },
    { k: 'c', name: '과학', color: '#4E3629' }
  ];
  var q = new URLSearchParams(location.search);
  // ?m=반키:코드&e=반키:코드&c=반키:코드&n=이름  (반키 = wol·hwa·g1·g2·ye·test)
  var have = SUBJ.filter(function (s) { return /^[a-z0-9]+:[a-z0-9]+$/i.test(q.get(s.k) || ''); });
  var tabs = document.getElementById('tabs'), box = document.getElementById('frames'), msg = document.getElementById('msg');
  if (q.get('n')) document.getElementById('who').innerHTML = q.get('n').replace(/[<>&"]/g, '') + '<small>학생</small>';
  if (!have.length) { msg.innerHTML = '링크가 올바르지 않아요.<br>학원에서 받은 <b>본인 전용 링크</b>로 들어와 주세요.'; return; }
  var frames = {};   // 주소별 iframe 한 개 (수학·과학이 같은 앱이면 같이 씀)
  function srcOf(s) { var v = q.get(s.k).split(':'); return v[0] + '.html?s=' + encodeURIComponent(v[1]); }
  function inner(fr, name, tries) {   // 앱 안 과목 탭을 숨기고 고른 과목으로 맞춤
    tries = tries || 0;
    try {
      var d = fr.contentDocument, br = d && d.querySelector('.brand'), bs = d && d.querySelectorAll('.subj button');
      if (br) br.style.display = 'none';   // 로고 띠는 위에 한 번만
      if (bs && bs.length) {
        var bar = d.querySelector('.subj'); if (bar) bar.style.display = 'none';
        for (var i = 0; i < bs.length; i++) if (bs[i].textContent.trim() === name && !bs[i].classList.contains('on')) bs[i].click();
        return;
      }
      if (br) return;   // 과목이 하나뿐인 앱
    } catch (e) {}
    if (tries < 60) setTimeout(function () { inner(fr, name, tries + 1); }, 250);
  }
  function show(s) {
    document.documentElement.style.setProperty('--c', s.color);
    [].forEach.call(tabs.children, function (b) { b.classList.toggle('on', b.dataset.k === s.k); });
    var src = srcOf(s), fr = frames[src];
    if (!fr) { fr = document.createElement('iframe'); fr.src = src; fr.title = s.name; box.appendChild(fr); frames[src] = fr; }
    if (msg.parentNode) msg.parentNode.removeChild(msg);
    Object.keys(frames).forEach(function (k) { frames[k].classList.toggle('on', frames[k] === fr); });
    inner(fr, s.name);
    try { history.replaceState(null, '', location.pathname + location.search + '#' + s.k); } catch (e) {}
  }
  have.forEach(function (s) {
    var b = document.createElement('button'); b.dataset.k = s.k;
    b.innerHTML = '<span class="dot" style="background:' + s.color + ';box-shadow:0 0 0 2px #fff"></span>' + s.name;
    b.onclick = function () { show(s); }; tabs.appendChild(b);
  });
  var start = have.filter(function (s) { return '#' + s.k === location.hash; })[0] || have[0];
  show(start);
})();
</script>
</body></html>
