<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/icon.png">
<title>올케어에듀 · 학습관리</title>
<style>
:root{--c:#1F3864}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#f5f6f8;color:#1d2433;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.bar{position:sticky;top:0;z-index:5;background:var(--c);color:#fff;padding:10px 14px 12px;transition:background .25s}
.row{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
.logo{height:26px;width:auto;background:#fff;border-radius:6px;padding:3px 6px}
.who{font-size:15px;font-weight:700;letter-spacing:-.2px}
.who small{font-weight:500;opacity:.8;margin-left:4px}
.tabs{display:flex;gap:6px;max-width:760px;margin:10px auto 0;background:rgba(255,255,255,.14);padding:4px;border-radius:12px}
.tabs:empty{display:none}
.tabs button{flex:1;border:0;background:transparent;color:#fff;font:inherit;font-size:16px;font-weight:700;padding:10px 0;border-radius:9px;cursor:pointer;opacity:.75}
.tabs button.on{background:#fff;color:var(--c);opacity:1;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.tabs button .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;box-shadow:0 0 0 2px #fff}
#frames{position:relative;height:calc(100dvh - 112px)}
#frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#f5f6f8;display:none}
#frames iframe.on{display:block}
.msg{padding:60px 20px;text-align:center;color:#667085;font-size:15px;line-height:1.7}
.sp{width:34px;height:34px;margin:0 auto 16px;border:4px solid #e4e0ee;border-top-color:#1F3864;border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.msg button{margin-top:14px;border:0;background:#1F3864;color:#fff;padding:12px 24px;border-radius:12px;font-size:15px;font-weight:700}
</style>
</head><body>
<div class="bar" id="bar">
  <div class="row"><img class="logo" src="/logo.png" alt="올케어에듀학원"><div class="who" id="who">학습관리</div></div>
  <div class="tabs" id="tabs"></div>
</div>
<div id="frames"><div class="msg" id="msg"><div class="sp"></div>불러오는 중…</div></div>
<script>
(function () {
  // 학생·학부모 링크 정보는 시트 [통합링크]에서 가져옵니다 (월수금 반 Apps Script, 읽기 전용)
  var API = 'https://script.google.com/macros/s/AKfycbwq4uCQD1Fvm1h2IumOB8_HJ4jkmZYfhidkMbBH5S4R_ZJVcyoLqXVWwV-M_v9_CmUk0Q/exec';
  var COLOR = { m: '#1F3864', e: '#4E2A84', c: '#4E3629', k: '#00563F' };
  var ORDER = ['m', 'e', 'c', 'k'];   // 수학이 첫 화면
  var q = new URLSearchParams(location.search), s = q.get('s') || '', p = q.get('p') || '';
  var tabs = document.getElementById('tabs'), box = document.getElementById('frames'), msg = document.getElementById('msg');
  function fail(t, retry) { msg.innerHTML = t + (retry ? '<br><button onclick="location.reload()">다시 열기</button>' : ''); }
  if (!/^[a-z0-9]{4,20}$/.test(s || p)) { fail('링크가 올바르지 않아요.<br>학원에서 받은 <b>본인 전용 링크</b>로 들어와 주세요.'); return; }
  var frames = {}, items = [];
  function inner(fr, name, tries) {   // 과목 화면 안의 로고 띠·과목 탭은 위 띠와 겹치므로 숨김
    tries = tries || 0;
    try {
      var d = fr.contentDocument, br = d && d.querySelector('.brand'), bs = d && d.querySelectorAll('.subj button');
      if (br && !d.getElementById('hubcss')) {
        var st = d.createElement('style'); st.id = 'hubcss'; st.textContent = '.brand,.subj{display:none!important}';
        (d.head || d.body).appendChild(st);
      }
      if (bs && bs.length) {
        for (var i = 0; i < bs.length; i++) if (bs[i].textContent.trim() === name && !bs[i].classList.contains('on')) bs[i].click();
        return;
      }
      if (br) return;
    } catch (e) {}
    if (tries < 80) setTimeout(function () { inner(fr, name, tries + 1); }, 250);
  }
  function show(it) {
    document.documentElement.style.setProperty('--c', COLOR[it.k] || '#1F3864');
    [].forEach.call(tabs.children, function (b) { b.classList.toggle('on', b.dataset.k === it.k); });
    var fr = frames[it.url];
    if (!fr) { fr = document.createElement('iframe'); fr.src = it.url; fr.title = it.name; box.appendChild(fr); frames[it.url] = fr; }
    if (msg.parentNode) msg.parentNode.removeChild(msg);
    Object.keys(frames).forEach(function (k) { frames[k].classList.toggle('on', frames[k] === fr); });
    inner(fr, it.name);
    try { history.replaceState(null, '', location.pathname + location.search + '#' + it.k); } catch (e) {}
  }
  var tries = 0;
  (function go() {
    tries++;
    fetch(API + (s ? '?h=' + encodeURIComponent(s) : '?hp=' + encodeURIComponent(p))).then(function (r) { return r.json(); }).then(function (j) {
      if (j.error === 'bad') { fail('링크를 확인해 주세요.<br>이 링크는 사용할 수 없습니다. 학원에서 받은 <b>본인 전용 링크</b>로 들어와 주세요.'); return; }
      if (j.error || !j.items || !j.items.length) throw new Error(j.error || 'empty');
      document.getElementById('who').innerHTML = String(j.name).replace(/[<>&"]/g, '') + '<small>' + (j.role === 'p' ? '학부모님' : '학생') + '</small>';
      document.title = '올케어에듀 · ' + j.name + (j.role === 'p' ? ' 학습현황' : ' 학습관리');
      items = j.items.slice().sort(function (a, b) { return ORDER.indexOf(a.k) - ORDER.indexOf(b.k); });
      items.forEach(function (it) {
        var b = document.createElement('button'); b.dataset.k = it.k;
        b.innerHTML = '<span class="dot" style="background:' + (COLOR[it.k] || '#999') + '"></span>' + it.name;
        b.onclick = function () { show(it); }; tabs.appendChild(b);
      });
      show(items.filter(function (it) { return '#' + it.k === location.hash; })[0] || items[0]);
    }).catch(function () {
      if (tries < 3) setTimeout(go, 1200 * tries);
      else fail('화면을 불러오지 못했어요.<br>인터넷 연결을 확인하고 다시 열어 주세요.', true);
    });
  })();
})();
</script>
</body></html>
